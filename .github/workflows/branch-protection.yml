name: Setup Branch Protection

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  setup:
    name: Apply branch protection rules
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: Protect main branch
        run: |
          gh api --method PUT repos/$REPO/branches/main/protection \
            --input - <<'EOF'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": []
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 1
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_linear_history": true,
            "required_conversation_resolution": true
          }
          PAYLOAD

          gh api \
            --method PUT \
            "repos/${{ github.repository }}/branches/main/protection" \
            --input /tmp/main-protection.json

          echo "main branch protection applied."

      - name: Protect development branch
        run: |
          gh api --method PUT repos/$REPO/branches/development/protection \
            --input - <<'EOF'
          {
            "required_status_checks": null,
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_linear_history": false,
            "required_conversation_resolution": false
          }
          PAYLOAD

          gh api \
            --method PUT \
            "repos/${{ github.repository }}/branches/development/protection" \
            --input /tmp/dev-protection.json

          echo "development branch protection applied."
