name: Setup Branch Protection

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # Create development branch if it doesn't exist
  # ──────────────────────────────────────────────
  create-development-branch:
    name: Create development branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create development branch if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTS=$(gh api repos/${{ github.repository }}/branches/development \
            --silent --jq '.name' 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            gh api repos/${{ github.repository }}/git/refs \
              -f ref="refs/heads/development" \
              -f sha="$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq '.object.sha')"
            echo "development branch created."
          else
            echo "development branch already exists."
          fi

  # ──────────────────────────────────────────────
  # Protect main — no direct pushes, PR required,
  # only merges from development are valid
  # (enforced via validate-merge-source.yml)
  # ──────────────────────────────────────────────
  protect-main:
    name: Protect main branch
    runs-on: ubuntu-latest
    needs: create-development-branch
    steps:
      - name: Apply main branch protection
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          gh api \
            --method PUT \
            repos/${{ github.repository }}/branches/main/protection \
            --input - <<'EOF'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["validate-merge-source"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 1,
              "bypass_pull_request_allowances": {
                "users": [],
                "teams": [],
                "apps": []
              }
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_linear_history": false,
            "required_conversation_resolution": true
          }
          EOF
          echo "main branch protection applied."

  # ──────────────────────────────────────────────
  # Protect development — PR required for everyone
  # except sharvil1701 who can push directly
  # ──────────────────────────────────────────────
  protect-development:
    name: Protect development branch
    runs-on: ubuntu-latest
    needs: create-development-branch
    steps:
      - name: Apply development branch protection
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          gh api \
            --method PUT \
            repos/${{ github.repository }}/branches/development/protection \
            --input - <<'EOF'
          {
            "required_status_checks": null,
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0,
              "bypass_pull_request_allowances": {
                "users": ["sharvil1701"],
                "teams": [],
                "apps": []
              }
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_linear_history": false,
            "required_conversation_resolution": false
          }
          EOF
          echo "development branch protection applied."
