name: Validate Merge Source

# Blocks any PR targeting main whose source is NOT development.
# This check is listed as a required status check in main's
# branch-protection rules, so it MUST pass before merging.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-merge-source:
    name: validate-merge-source
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR comes from development
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"
          echo "PR: $SOURCE -> $TARGET"

          if [ "$TARGET" = "main" ] && [ "$SOURCE" != "development" ]; then
            echo "::error::PRs to 'main' are ONLY allowed from the 'development' branch."
            echo "::error::This PR originates from '$SOURCE'."
            echo "::error::Please merge your changes into 'development' first, then create a PR from 'development' -> 'main'."
            exit 1
          fi

          echo "Source branch is 'development'. Merge is allowed."
